# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# PawHub — Frontend .coderabbit.yaml
# Scope: pawhub-client (Next.js 16.2, React 19, Tailwind v4, shadcn/ui, TypeScript)
# Docs: https://docs.coderabbit.ai/reference/configuration

language: "en-US"
early_access: false

# ---------------------------------------------------------------------------
# Reviews
# ---------------------------------------------------------------------------
reviews:
  profile: "assertive"
  request_changes_workflow: true

  high_level_summary: true
  high_level_summary_in_walkthrough: false
  high_level_summary_instructions: |
    Produce concise release notes as a bullet-point list grouped by type:
    feat, fix, refactor, perf, chore. Skip trivial formatting or token changes.

  review_status: true
  review_details: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  poem: false
  in_progress_fortune: false

  commit_status: true
  fail_commit_status: true
  abort_on_close: true

  # --- Labels ---------------------------------------------------------------
  suggested_labels: true
  auto_apply_labels: true
  labeling_instructions:
    - label: "feat"
      instructions: "Apply when the PR introduces new user-facing UI or frontend functionality."
    - label: "fix"
      instructions: "Apply when the PR resolves a visual bug, broken interaction, or incorrect frontend behaviour."
    - label: "refactor"
      instructions: "Apply when the PR restructures components or logic without changing external behaviour."
    - label: "perf"
      instructions: "Apply when the PR targets bundle size, rendering performance, or Core Web Vitals."
    - label: "a11y"
      instructions: "Apply when the PR improves or fixes accessibility — ARIA roles, keyboard nav, colour contrast."
    - label: "design-system"
      instructions: "Apply when the PR changes shared design tokens, globals.css, or reusable shadcn wrappers."
    - label: "chore"
      instructions: "Apply when the PR updates dependencies, configs, or housekeeping with no functional change."

  # --- Reviewers ------------------------------------------------------------
  suggested_reviewers: true
  auto_assign_reviewers: false

  # --- Auto-review rules ----------------------------------------------------
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 10
    base_branches:
      - "main"
      - "staging"
      - "dev"
    ignore_title_keywords:
      - "[skip review]"
      - "WIP"
      - "DO NOT MERGE"
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"

  # --- Path filters — skip all generated/binary artifacts -------------------
  path_filters:
    - "!.next/**"
    - "!dist/**"
    - "!out/**"
    - "!coverage/**"
    - "!public/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/*.map"
    - "!__generated__/**"
    - "!node_modules/**"
    - "!package-lock.json"
    - "!yarn.lock"
    - "!pnpm-lock.yaml"

  # --- Path-specific review instructions ------------------------------------
  path_instructions:

    # App Router — pages, layouts, loading, error boundaries
    - path: "src/app/**"
      instructions: |
        - Server Components must not import or use client-only APIs (useState, useEffect, browser globals).
        - Every data-fetching Server Component must call `auth()` before any database or API access.
        - Server Actions must validate and sanitize all inputs server-side — never trust raw FormData.
        - After every mutation Server Action, `revalidatePath` or `revalidateTag` must be called.
        - Flag any `dangerouslySetInnerHTML` usage — require explicit justification.
        - `loading.tsx` and `error.tsx` boundaries must be present alongside any data-fetching page.
        - Dynamic routes must handle the not-found case via `notFound()`.

    # Shared & feature components
    - path: "src/components/**"
      instructions: |
        - Arrow-function components only — no `function` keyword declarations.
        - No code comments unless the logic is genuinely non-obvious.
        - Tailwind v4 only: use design tokens defined in `globals.css` (@theme block).
          No hardcoded hex, rgb, or hsl values. No inline `style` props for colours or spacing.
          No `var(--token)` calls in JSX — utility classes only (e.g. `bg-amethyst-accent`).
        - shadcn/ui composition must follow official patterns:
          TabsList must wrap TabsTrigger; Dialog must use DialogContent > DialogHeader hierarchy.
          Never re-implement shadcn primitives with manual useState.
        - All interactive elements must be keyboard-accessible and have ARIA labels where text is absent.
        - Lucide icons must use the `size` prop (e.g. `size={16}`) — never `width`/`height` attributes.
        - Props interfaces must be typed; no implicit `any`.

    # Settings modal (active development area)
    - path: "src/components/settings/**"
      instructions: |
        - The SettingsDialog must use shadcn Tabs with `orientation="vertical"`.
        - TabsList + TabsTrigger must live in SettingsSidebar; TabsContent panels in the main area.
        - Tab IDs must be sourced from the SettingsTabId union type — no magic strings.
        - Destructive actions (account deletion) must use the `destructive` variant and require a confirmation step.
        - No activeTab useState in the dialog shell — Radix Tabs owns that state.

    # Server actions
    - path: "src/actions/**"
      instructions: |
        - Must include `"use server"` directive.
        - Must call `auth()` at the top and throw/redirect if unauthenticated.
        - Input must be validated with zod or equivalent before any API call.
        - Must not return raw Error objects to the client — return typed result objects instead.

    # API client / fetch utilities
    - path: "src/lib/**"
      instructions: |
        - `apiFetch` must be the only fetch wrapper used — no raw `fetch()` calls in components or hooks.
        - Ensure auth tokens are attached via the utility, never manually in call sites.
        - Flag any hardcoded API URLs — all base URLs must come from environment variables.

    # Hooks
    - path: "src/hooks/**"
      instructions: |
        - Custom hooks must start with `use` prefix.
        - Hooks must not contain JSX.
        - Hooks that fetch data must handle loading, error, and empty states explicitly.
        - `useActionState` is preferred over multiple `useState` hooks for form handling.

    # Global styles and design tokens
    - path: "src/app/globals.css"
      instructions: |
        - All design tokens must live inside the `@theme` block — no loose CSS custom properties.
        - Do not remove or rename existing tokens without checking all usages across components.
        - New colour tokens must follow the existing naming convention (e.g. `--color-amethyst-accent`).

    # Environment variables
    - path: ".env*"
      instructions: |
        - These files must contain only placeholder values — never real secrets or tokens.
        - Verify that any new `NEXT_PUBLIC_` variable does not accidentally expose a secret.
        - Flag any variable not present in `.env.example`.

  # --- Pre-merge quality gates ----------------------------------------------
  pre_merge_checks:
    override_requested_reviewers_only: false
    title:
      mode: "error"
      requirements: |
        Title must follow Conventional Commits: <type>(<optional scope>): <description>
        Allowed types: feat, fix, refactor, perf, test, chore, docs, a11y, design-system
        Example: feat(settings): add security tab with 2FA toggle
    description:
      mode: "warning"
    issue_assessment:
      mode: "warning"
    custom_checks:
      - name: "No hardcoded design values"
        mode: "error"
        instructions: |
          Fail if the diff introduces hardcoded colour values (hex, rgb(), hsl()) or pixel spacing
          values in JSX className strings or inline style props. All values must reference Tailwind
          v4 utility classes generated from the @theme block in globals.css.
      - name: "No raw fetch in components"
        mode: "warning"
        instructions: |
          Warn if any component or hook uses `fetch(` directly instead of the `apiFetch` utility.
      - name: "Server Actions have auth check"
        mode: "error"
        instructions: |
          Fail if a file with `"use server"` directive exports an async function that does not call
          `auth()` (or an equivalent session check) before accessing external data or mutating state.

  # --- Finishing touches ----------------------------------------------------
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: true

  # --- Tools — frontend-relevant only ---------------------------------------
  tools:
    eslint:
      enabled: true
    biome:
      enabled: true
    oxc:
      enabled: true
    stylelint:
      enabled: true
    markdownlint:
      enabled: true
    htmlhint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    opengrep:
      enabled: true
    semgrep:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 120000
    ast-grep:
      essential_rules: true

    # Irrelevant to frontend — explicitly disabled
    shellcheck:
      enabled: false
    actionlint:
      enabled: false
    hadolint:
      enabled: false
    checkov:
      enabled: false
    tflint:
      enabled: false
    osvScanner:
      enabled: false
    presidio:
      enabled: false
    swiftlint:
      enabled: false
    ruff:
      enabled: false
    flake8:
      enabled: false
    pylint:
      enabled: false
    phpstan:
      enabled: false
    phpmd:
      enabled: false
    phpcs:
      enabled: false
    rubocop:
      enabled: false
    brakeman:
      enabled: false
    golangci-lint:
      enabled: false
    detekt:
      enabled: false
    pmd:
      enabled: false
    clang:
      enabled: false
    cppcheck:
      enabled: false
    circleci:
      enabled: false
    clippy:
      enabled: false
    regal:
      enabled: false
    buf:
      enabled: false
    sqlfluff:
      enabled: false
    fortitudeLint:
      enabled: false
    luacheck:
      enabled: false
    blinter:
      enabled: false
    smartyLint:
      enabled: false
    emberTemplateLint:
      enabled: false
    psscriptanalyzer:
      enabled: false
    shopifyThemeCheck:
      enabled: false

# ---------------------------------------------------------------------------
# Chat
# ---------------------------------------------------------------------------
chat:
  auto_reply: true
  allow_non_org_members: false

# ---------------------------------------------------------------------------
# Knowledge base
# ---------------------------------------------------------------------------
knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  learnings:
    scope: "local"
  issues:
    scope: "local"
  pull_requests:
    scope: "local"
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - "**/.cursorrules"
      - ".github/copilot-instructions.md"

# ---------------------------------------------------------------------------
# Code generation
# ---------------------------------------------------------------------------
code_generation:
  docstrings:
    language: "en-US"
    path_instructions:
      - path: "src/components/**/*.tsx"
        instructions: |
          Generate JSDoc for exported components only. Document props using @param.
          Skip trivial presentational wrappers — only document components with non-obvious behaviour.
      - path: "src/hooks/**/*.ts"
        instructions: |
          Generate JSDoc for every exported hook. Document parameters, return value,
          and any side effects (e.g. cache invalidation, navigation).
      - path: "src/lib/**/*.ts"
        instructions: |
          Generate JSDoc for all exported functions. Document parameters, return type,
          and thrown errors. Note if the function requires an authenticated context.
  unit_tests:
    path_instructions:
      - path: "src/components/**/*.tsx"
        instructions: |
          Use Vitest + React Testing Library. Test user interactions and rendered output —
          not implementation details or internal state. Cover: renders correctly, handles
          loading/error/empty states, key interactions (click, submit).
      - path: "src/hooks/**/*.ts"
        instructions: |
          Use Vitest + renderHook from React Testing Library.
          Mock `apiFetch` at the module level. Test happy path, error state, and loading state.
      - path: "src/lib/**/*.ts"
        instructions: |
          Use Vitest. Pure utility functions should have 100% branch coverage.
          Mock external dependencies (fetch, auth) at the module boundary.